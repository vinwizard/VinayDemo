# What these checks cover: the Python engine tests under tests/, the web
# TypeScript types (tsc -b) and the web lint (oxlint).
# What they do NOT cover: api/main.py and the /api/stream SSE endpoint have no
# tests at all, so a green tick here says nothing about the HTTP server.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Python tests
        run: python -m pytest -q

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: TypeScript typecheck
        run: npx tsc -b
        working-directory: web

      - name: Lint
        run: npx oxlint
        working-directory: web
