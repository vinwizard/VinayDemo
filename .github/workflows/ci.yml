# What these checks cover: the Python engine tests under tests/, the web
# TypeScript types (tsc -b), the web lint (oxlint) and the web unit tests (npm test). api/main.py is tested over HTTP through
# fastapi's TestClient (tests/test_api_http.py): health, runs and companies (status codes and JSON),
# a bundled run streamed as SSE on the wire and reopened, the intent rules on PATCH /api/companies/{id}, and
# a sentinel key that must appear in no response body or header. tests/test_api_stream.py and
# tests/test_api_seed.py drive the stream generators directly; /api/onboard and
# /api/onboard/stream are covered only that way, not over HTTP. tests/test_access.py covers the access
# passes over HTTP: the code exchange and cookie, admin sign-in, the spend meter against a fake usage
# payload, refusal at the cap, which pass sees which run, and seeding a fresh DATA_DIR from the
# committed companies and runs. tests/test_audit.py replays recorded pages, robots.txt and
# Wikidata/Wikipedia answers for the site audit; tests/conftest.py refuses every audit fetch otherwise.
# What they do NOT cover: TestClient is in-process, so a real uvicorn server, proxy buffering and
# the CORS policy are untested. The only web/src behaviour CI executes is the positioning map's label
# placement and the report tab badges (web/src/*.test.ts, `node --test`); the rest — including the stream client in
# web/src/api.ts — is only typechecked and linted.
# Live model behaviour is not tested and must not be: CI has no key, the live path runs only
# under an injected transport, and no real provider is ever called.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Python tests
        run: python -m pytest -q

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: TypeScript typecheck
        run: npx tsc -b
        working-directory: web

      - name: Lint
        run: npx oxlint
        working-directory: web

      - name: Web unit tests
        run: npm test
        working-directory: web
