# The offline checks: Python tests, web typecheck, lint and unit tests. No step has a key, so no real
# provider is ever called; live paths run only under injected transports.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2

      - name: Lines added per area (report only)
        if: github.event_name == 'pull_request'
        run: |
          git diff --numstat HEAD^1 HEAD -- . ':!*.png' ':!*.json' ':!*.lock' |
          awk '{ f=$3; a = (f ~ /^tests\// || f ~ /\.test\.tsx?$/) ? "tests" : f ~ /^web\// ? "web" : (f ~ /\.md$/ || f ~ /^\.claude\//) ? "docs" : f ~ /\.py$/ ? "backend" : "other";
                 add[a]+=$1; del[a]+=$2; ta+=$1; td+=$2 }
               END { print "| area | added | removed | net |"; print "|---|---|---|---|";
                     for (k in add) printf "| %s | %d | %d | %+d |\n", k, add[k], del[k], add[k]-del[k];
                     printf "| **all** | %d | %d | **%+d** |\n", ta, td, ta-td }' | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Python tests
        run: python -m pytest -q

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: TypeScript typecheck
        run: npx tsc -b
        working-directory: web

      - name: Lint
        run: npx oxlint
        working-directory: web

      - name: Web unit tests
        run: npm test
        working-directory: web
