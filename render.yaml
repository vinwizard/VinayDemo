# Render Blueprint: one free web service running the saved replay only. See "Deploy to Render" in README.md.
services:
  - type: web
    name: positioning-drift-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Public link: replay only. Live runs, onboarding and edits are refused; no key is ever read.
      - key: VISEXP_PUBLIC_DEMO
        value: "1"
